name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma validate/generate needs a syntactically valid URL but never connects in this job.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/knowledgeops_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository verification
        run: pnpm verify:ci

  regression:
    name: Core reliability and browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/knowledgeops_r16_e2e
      REDIS_URL: redis://127.0.0.1:6379
      NUXT_TELEMETRY_DISABLED: '1'
    # 只属于本次 CI 的临时服务，不连接 VPS 或开发数据库。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: knowledgeops_r16_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d knowledgeops_r16_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mark this ephemeral test database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec "$POSTGRES_CONTAINER"
          psql -U ci -d knowledgeops_r16_e2e --set ON_ERROR_STOP=on
          --command "COMMENT ON DATABASE knowledgeops_r16_e2e IS 'KnowledgeOps R16 E2E synthetic fixtures only';"

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run database and Worker fault regressions
        run: pnpm test:integration:r16

      - name: Build applications and run browser flows
        run: pnpm test:e2e:r16

      - name: Upload browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: r16-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
