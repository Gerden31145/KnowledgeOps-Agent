# systemd drop-in: /etc/systemd/system/pm2-root.service.d/knowledgeops.conf
# Target: the confirmed root-owned Node 24.19.0 installation on this VPS.
[Unit]
Wants=network-online.target docker.service
After=network-online.target docker.service

[Service]
Type=forking
User=root
WorkingDirectory=/opt/knowledgeops-agent
Environment="PATH=/root/.nvm/versions/node/v24.19.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
Environment="PM2_HOME=/root/.pm2"
PIDFile=/root/.pm2/pm2.pid

# Wait for this project's dependencies before launching API and Worker.
ExecStartPre=/usr/bin/docker compose --env-file /opt/knowledgeops-agent/.env -f /opt/knowledgeops-agent/deploy/compose.yaml up -d --pull never --wait --wait-timeout 60
ExecStart=
ExecStart=/root/.nvm/versions/node/v24.19.0/bin/node /root/.nvm/versions/node/v24.19.0/lib/node_modules/pm2/bin/pm2 start /opt/knowledgeops-agent/deploy/ecosystem.config.json
ExecReload=
ExecReload=/root/.nvm/versions/node/v24.19.0/bin/node /root/.nvm/versions/node/v24.19.0/lib/node_modules/pm2/bin/pm2 restart /opt/knowledgeops-agent/deploy/ecosystem.config.json
ExecStop=
ExecStop=/root/.nvm/versions/node/v24.19.0/bin/node /root/.nvm/versions/node/v24.19.0/lib/node_modules/pm2/bin/pm2 stop /opt/knowledgeops-agent/deploy/ecosystem.config.json
KillMode=process
Restart=on-failure
RestartSec=5
TimeoutStartSec=120
TimeoutStopSec=240
