# Local learning fixture only. This override must never be used for production.
services:
  api:
    networks: [default, host_access]
  web:
    networks: [default, host_access]
  # Storage is accessed by service name inside the exercise network.
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  model:
    image: ${WEB_IMAGE:-knowledgeops-web:cd01}
    init: true
    command: ['node', '/fixture/cd01-model.mjs']
    volumes:
      - ../tests/deploy/cd01-model.mjs:/fixture/cd01-model.mjs:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 10
  worker:
    depends_on:
      model:
        condition: service_healthy

# Worker, model and storage remain internal. API/Web also need a normal bridge
# for their loopback host port mappings; internal-only bridges do not publish them.
networks:
  default:
    internal: true
  host_access: {}
