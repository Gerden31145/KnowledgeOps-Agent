# Include from the http context (Ubuntu sites-enabled). Do not log OAuth query strings.
log_format knowledgeops_no_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                                '$status $body_bytes_sent $request_time';

server {
  listen 80;
  listen [::]:80;
  server_name knowops.site;
  server_tokens off;

  access_log /var/log/nginx/knowledgeops-access.log knowledgeops_no_query;
  error_log /var/log/nginx/knowledgeops-error.log crit;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 308 https://knowops.site$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name knowops.site;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/knowops.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/knowops.site/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  access_log /var/log/nginx/knowledgeops-access.log knowledgeops_no_query;
  # Error log formats cannot omit query strings. Application logs handle ordinary failures.
  error_log /var/log/nginx/knowledgeops-error.log crit;

  client_max_body_size 128k;
  keepalive_timeout 65s;
  send_timeout 30s;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://api.knowops.site; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests" always;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_hide_header X-Powered-By;
  proxy_cache off;
  proxy_connect_timeout 5s;

  location / {
    if (-f /var/lib/knowledgeops-maintenance) { return 503; }
    proxy_pass http://127.0.0.1:3200;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name api.knowops.site;
  server_tokens off;
  access_log /var/log/nginx/knowledgeops-access.log knowledgeops_no_query;
  error_log /var/log/nginx/knowledgeops-error.log crit;
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }
  location / { return 308 https://api.knowops.site$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.knowops.site;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/knowops.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/knowops.site/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  access_log /var/log/nginx/knowledgeops-access.log knowledgeops_no_query;
  # Error log formats cannot omit query strings. Application logs handle ordinary failures.
  error_log /var/log/nginx/knowledgeops-error.log crit;

  client_max_body_size 128k;
  keepalive_timeout 65s;
  send_timeout 30s;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests" always;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_hide_header X-Powered-By;
  proxy_cache off;
  proxy_connect_timeout 5s;

  location = /health {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:4000;
  }

  # Keep dependency checks local, including checks routed through HTTPS.
  location ^~ /health/ {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:4000/health/;
    proxy_read_timeout 15s;
  }

  location / {
    # CD03 toggles this file only during an explicit production release.
    if (-f /var/lib/knowledgeops-maintenance) { return 503; }
    proxy_pass http://127.0.0.1:4000/;
    # This also covers plan-generation-runs/:id/events (SSE).
    gzip off;
    proxy_buffering off;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }

}
