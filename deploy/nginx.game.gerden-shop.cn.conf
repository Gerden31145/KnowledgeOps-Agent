# Retired hostname: no application routes; ACME remains available for its existing certificate.
server {
  listen 80;
  listen [::]:80;
  server_name game.gerden-shop.cn;
  server_tokens off;
  access_log off;
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }
  location / { return 410; }
}
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name game.gerden-shop.cn;
  ssl_certificate /etc/letsencrypt/live/game.gerden-shop.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/game.gerden-shop.cn/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  server_tokens off;
  access_log off;
  return 410;
}
